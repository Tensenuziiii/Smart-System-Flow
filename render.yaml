services:
  - type: web
    name: devonboard-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: devonboard-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: devonboard-db
    databaseName: devonboard
    user: devonboard
    plan: free
    region: oregon